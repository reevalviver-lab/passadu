<div class="page-head"><h4>เบิกพัสดุ</h4></div>
<div class="card"><form class="card-body" id="stockOutForm"><div class="row g-3">
<div class="col-md-4"><label>วันที่เบิก</label><input id="outDate" type="date" class="form-control" required></div><div class="col-md-4"><label>ผู้เบิกพัสดุ</label><input id="outRequester" class="form-control" readonly></div><div class="col-md-4"><label>กลุ่มงาน</label><input id="outDepartment" class="form-control" readonly></div>
<div class="col-md-4"><label>ประเภทวัสดุ</label><select id="outCategory" class="form-select" onchange="filterStockItems('out')"><option value="">-- ทุกประเภท --</option></select></div><div class="col-md-4"><label>รายการวัสดุ</label><select id="outItem" class="form-select" required onchange="setOutItemInfo()"></select></div><div class="col-md-2"><label>คงเหลือ</label><input id="outBalance" class="form-control" readonly></div><div class="col-md-2"><label>จำนวนเบิก</label><input id="outQty" type="number" step="1" min="1" inputmode="numeric" pattern="[0-9]*" class="form-control" required oninput="calcOutTotal()"></div><div class="col-md-2"><label>ยอดเงิน</label><input id="outTotal" class="form-control" readonly></div>
<div class="col-md-12"><label>วัตถุประสงค์</label><input id="outPurpose" class="form-control"></div><div class="col-md-12"><label>หมายเหตุ</label><input id="outNote" class="form-control"></div><div class="col-12"><button class="btn btn-danger" data-loading-text="กำลังส่งคำขอ..."><i class="bi bi-send"></i> ส่งคำขอเบิกพัสดุ</button></div>
</div></form></div>
