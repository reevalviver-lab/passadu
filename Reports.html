<div class="page-head"><h4>รายงาน</h4><div><button class="btn btn-outline-success" onclick="exportCSV()"><i class="bi bi-filetype-csv"></i> CSV</button> <button class="btn btn-outline-primary" onclick="window.print()"><i class="bi bi-printer"></i> พิมพ์</button></div></div>
<div class="card mb-3 no-print"><div class="card-body"><div class="row g-2 align-items-end">
<div class="col-md-3"><label>ประเภทรายงาน</label><select id="reportType" class="form-select"><option value="balance">รายงานวัสดุคงเหลือ</option><option value="requests">รายงานคำขอเบิกพัสดุ</option><option value="in" class="admin-option">รายงานรับเข้าวัสดุ</option><option value="out">รายงานเบิกพัสดุ</option><option value="out_category" class="admin-option">เบิกพัสดุแยกตามประเภท</option><option value="out_department" class="admin-option">เบิกพัสดุแยกตามกลุ่มงาน</option><option value="low">วัสดุใกล้หมด</option><option value="value">มูลค่าวัสดุคงเหลือ</option></select></div>
<div class="col-md-2"><label>ช่วงเวลา</label><select id="reportRange" class="form-select" onchange="toggleCustomDate('report')"><option value="today">รายวัน</option><option value="week">รายสัปดาห์</option><option value="month" selected>รายเดือน</option><option value="year">รายปี</option><option value="custom">กำหนดเอง</option></select></div>
<div class="col-md-3"><label>ประเภทวัสดุ</label><select id="reportCategory" class="form-select"><option value="">ทุกประเภทวัสดุ</option></select></div>
<div class="col-md-2 custom-report d-none"><label>เริ่ม</label><input id="reportStart" type="date" class="form-control"></div><div class="col-md-2 custom-report d-none"><label>สิ้นสุด</label><input id="reportEnd" type="date" class="form-control"></div><div class="col-md-2"><button class="btn btn-primary" onclick="loadReport()"><i class="bi bi-search"></i> แสดงรายงาน</button></div>
</div></div></div>
<div class="card"><div class="card-body"><h5 id="reportTitle" class="mb-3">รายงาน</h5><div class="table-responsive" id="reportTableWrap"></div><div id="reportPager" class="pager-wrap"></div></div></div>
