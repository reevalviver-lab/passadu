<div class="page-head"><h4>รับเข้าวัสดุ</h4></div>
<div class="card"><form class="card-body" id="stockInForm"><div class="row g-3">
<div class="col-md-4"><label>วันที่รับเข้า</label><input id="inDate" type="date" class="form-control" required></div><div class="col-md-4"><label>ผู้ขาย/ผู้ส่งมอบ</label><input id="inSupplier" class="form-control"></div><div class="col-md-4"><label>เลขที่เอกสาร</label><input id="inDoc" class="form-control"></div>
<div class="col-md-4"><label>ประเภทวัสดุ</label><select id="inCategory" class="form-select" onchange="filterStockItems('in')"><option value="">-- ทุกประเภท --</option></select></div><div class="col-md-4"><label>รายการวัสดุ</label><select id="inItem" class="form-select" required onchange="setInItemInfo()"></select></div><div class="col-md-2"><label>จำนวน</label><input id="inQty" type="number" step="1" min="1" inputmode="numeric" pattern="[0-9]*" class="form-control" required oninput="calcInTotal()"></div><div class="col-md-2"><label>ราคาต่อหน่วย</label><input id="inPrice" type="number" step="1" min="0" inputmode="numeric" pattern="[0-9]*" class="form-control" required oninput="calcInTotal()"></div><div class="col-md-2"><label>มูลค่า</label><input id="inTotal" class="form-control" readonly></div>
<div class="col-md-12"><label>หมายเหตุ</label><input id="inNote" class="form-control"></div><div class="col-12"><button class="btn btn-success" data-loading-text="กำลังบันทึก..."><i class="bi bi-save"></i> บันทึกรับเข้า</button></div>
</div></form></div>
